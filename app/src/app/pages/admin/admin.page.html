<app-header headerName="ADMINISTRACIÓN"></app-header>

<ion-content class="admin-bg">
    <ion-grid class="ion-padding">
        <ion-row class="ion-align-items-stretch">

            <!-- Opción Usuarios (Ícono corregido) -->
            <ion-col size="6" sizeMd="4" sizeLg="3">
                <ion-card button (click)="goToUsers()" class="modern-menu-card">
                    <div class="modern-icon-wrapper">
                        <ion-icon name="people" class="modern-icon"></ion-icon>
                    </div>
                    <div class="menu-info">
                        <ion-card-title class="modern-title">Usuarios</ion-card-title>
                        <ion-card-content class="modern-subtitle">
                            Gestionar usuarios
                        </ion-card-content>
                    </div>
                </ion-card>
            </ion-col>

            <!-- Opciones Dinámicas -->
            <ion-col size="6" sizeMd="4" sizeLg="3" *ngFor="let entity of entities">
                <ion-card button (click)="goToEntity(entity)" class="modern-menu-card">
                    <div class="modern-icon-wrapper">
                        <ion-icon [name]="getIconForEntity(entity.plural)" class="modern-icon"></ion-icon>
                    </div>
                    <div class="menu-info">
                        <ion-card-title class="modern-title">{{ entity.plural }}</ion-card-title>
                        <ion-card-content class="modern-subtitle">
                            Gestionar {{ entity.plural.toLowerCase() }}
                        </ion-card-content>
                    </div>
                </ion-card>
            </ion-col>

        </ion-row>
    </ion-grid>

    <app-footer></app-footer>
</ion-content>
