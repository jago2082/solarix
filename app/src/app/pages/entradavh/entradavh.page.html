<app-header headerName="Entrada Vehículo"></app-header>

<ion-content class="ion-padding" color="secondary" >
  <form [formGroup]="form" (ngSubmit)="guardar()">
    <ion-item>
      <ion-label position="floating">Placa</ion-label>
      <ion-input formControlName="placa" type="text" maxlength="6" autocapitalize="characters"></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="campoValido('placa')">
      <p class="ion-padding-start">{{ mensajeErrorPlaca() }}</p>
    </ion-text>

    <ion-item>
      <ion-label>Tipo Vehículo</ion-label>
      <ion-select formControlName="tipoVehiculo" interface="popover" placeholder="Seleccionar">
        <ion-select-option *ngFor="let tipo of tiposVehiculo" [value]="tipo">{{ tipo }}</ion-select-option>
      </ion-select>
    </ion-item>
    <ion-text color="danger" *ngIf="campoValido('tipoVehiculo')">
      <p class="ion-padding-start">Tipo de vehículo es obligatorio</p>
    </ion-text>

    <ion-item>
      <ion-label>Tipo Tarifa</ion-label>
      <ion-select formControlName="tipoTarifa" interface="popover" placeholder="Seleccionar">
        <ion-select-option *ngFor="let tarifa of tiposTarifa" [value]="tarifa">{{ tarifa }}</ion-select-option>
      </ion-select>
    </ion-item>
    <ion-text color="danger" *ngIf="campoValido('tipoTarifa')">
      <p class="ion-padding-start">Tipo de tarifa es obligatorio</p>
    </ion-text>

    <ion-item>
      <ion-label position="stacked">Fecha Entrada</ion-label>
      <ion-input formControlName="fechaEntrada" type="date" readonly></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="campoValido('fechaEntrada')">
      <p class="ion-padding-start">La fecha es obligatoria</p>
    </ion-text>

    <ion-item>
      <ion-label position="stacked">Hora Entrada</ion-label>
      <ion-input formControlName="horaEntrada" type="time" readonly></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="campoValido('horaEntrada')">
      <p class="ion-padding-start">La hora es obligatoria</p>
    </ion-text>

    <ion-button expand="full" type="submit" class="ion-margin-top" color="primary" >Guardar</ion-button>
  </form>
  <app-footer></app-footer>
</ion-content>
