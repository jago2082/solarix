<app-header headerName="Vehículos Pendientes"></app-header>

<ion-content class="ion-padding" color="secondary">

  <!-- Buscador Global -->
  <div class="p-input-icon-left ion-margin-bottom">
    <i class="pi pi-search"></i>
    <input type="text" pInputText placeholder="Buscar..." (input)="aplicarFiltroGlobal($event)"  />
  </div>

  <!-- Tabla -->
  <p-table 
    #table 
    [value]="data"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5,10,20]"
    [globalFilterFields]="['pIng_tive', 'pIng_Plac', 'pIng_tari', 'pIng_feen', 'pIng_hoen']"
    [responsiveLayout]="'scroll'"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
    class="mi-tabla p-datatable-sm p-datatable-gridlines p-datatable-striped"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Tipo Vehículo</th>
        <th>Placa</th>
        <th>Tarifa</th>
        <th>Fecha Entrada</th>
        <th>Hora Entrada</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-item>
      <tr>
        <td>{{ item.pIng_tive }}</td>
        <td>{{ item.pIng_Plac }}</td>
        <td>{{ item.pIng_tari }}</td>
        <td>{{ item.pIng_feen?.slice(0, 10) }}</td>
        <td>{{ item.pIng_hoen }}</td>
      </tr>
    </ng-template>
  </p-table>
  <app-footer></app-footer>
</ion-content>
