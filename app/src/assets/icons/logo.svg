      <path d="M 0,-72 L 36,-84 L 24,-40 L -12,-28 Z" fill="#00DCB0" transform="rotate(45)" />
      <path d="M 0,-72 L 36,-84 L 24,-40 L -12,-28 Z" fill="#00C9DB" transform="rotate(90)" />
      <path d="M 0,-72 L 36,-84 L 24,-40 L -12,-28 Z" fill="#00AEEF" transform="rotate(135)" />
      <path d="M 0,-72 L 36,-84 L 24,-40 L -12,-28 Z" fill="#0092E4" transform="rotate(180)" />
      <path d="M 0,-72 L 36,-84 L 24,-40 L -12,-28 Z" fill="#00B8D9" transform="rotate(225)" />
      <path d="M 0,-72 L 36,-84 L 24,-40 L -12,-28 Z" fill="#00D2B8" transform="rotate(270)" />
      <path d="M 0,-72 L 36,-84 L 24,-40 L -12,-28 Z" fill="#00E099" transform="rotate(315)" />
    </g>

