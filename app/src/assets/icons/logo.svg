<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800&amp;display=swap');
      .brand-title {
        font-family: 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        font-size: 112px;
        fill: #000000;
        letter-spacing: -3px;
      }
    </style>
  </defs>

  <g id="solaxgen-logo">
    <!-- Icon: 8 Parallelogram Blades -->
    <g transform="translate(110, 110)">
